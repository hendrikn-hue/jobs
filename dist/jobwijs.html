<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jobwijs</title>
<meta name="description" content="Prototype van een Belgische jobsite: zoek op functie en plaats of beschrijf je ideale job in een prompt.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: smalle topbar, groene zoekband met witte zoekkaart, daarna 2-koloms werkruimte (filters | resultaten / tekst | sollicitatiekaart). */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #e9eeec;
  --ink: #15201e;
  --muted: #5a6866;
  --line: #d9e1de;
  --brand: #0f5a4e;
  --brand-strong: #0a453b;
  --brand-ink: #ffffff;
  --brand-soft: #dcebe7;
  --accent: #e5ae1f;
  --accent-soft: #fbf0cf;
  --accent-ink: #5a4100;
  --good: #1f7a4a;
  --bad: #a1452f;
  --logo-bg-l: 89%;
  --logo-fg-l: 28%;
  --shadow: 0 1px 2px rgb(15 40 35 / 0.06), 0 8px 24px -12px rgb(15 40 35 / 0.18);

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --r: 10px;
  --r-sm: 6px;
  --wrap: 1180px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #16201d; --surface-2: #1d2a26; --ink: #e5edea; --muted: #94a5a0; --line: #283632;
    --brand: #4fb39f; --brand-strong: #6cc8b5; --brand-ink: #062019; --brand-soft: #18352f;
    --accent: #f0c24b; --accent-soft: #3a3115; --accent-ink: #f6d98a; --good: #5cc28a; --bad: #e48a72;
    --logo-bg-l: 24%; --logo-fg-l: 84%;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 10px 28px -14px rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16201d; --surface-2: #1d2a26; --ink: #e5edea; --muted: #94a5a0; --line: #283632;
  --brand: #4fb39f; --brand-strong: #6cc8b5; --brand-ink: #062019; --brand-soft: #18352f;
  --accent: #f0c24b; --accent-soft: #3a3115; --accent-ink: #f6d98a; --good: #5cc28a; --bad: #e48a72;
  --logo-bg-l: 24%; --logo-fg-l: 84%;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.3), 0 10px 28px -14px rgb(0 0 0 / 0.6);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.55 var(--f-body);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
main { flex: 1; outline: none; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--brand); text-underline-offset: 3px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: 20px; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }
.eyebrow { font: 600 12px/1.3 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

/* Topbar */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.topbar-inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 60px; }
.brand { display: inline-flex; align-items: center; gap: 10px; color: var(--brand); text-decoration: none; font: 800 23px/1 var(--f-display); letter-spacing: -0.03em; }
.brand span { color: var(--ink); }
.brand-mark { width: 30px; height: 30px; flex: none; }
.topnav { display: flex; gap: 4px; }
.topnav a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; padding: 8px 12px; border-radius: var(--r-sm); display: inline-flex; gap: 8px; align-items: center; }
.topnav a:hover { background: var(--surface-2); }
.count { font: 500 12px/1 var(--f-mono); background: var(--brand-soft); color: var(--brand-strong); padding: 4px 7px; border-radius: 99px; min-width: 22px; text-align: center; }

/* Buttons */
.btn { font: 600 15px/1 var(--f-body); border-radius: var(--r-sm); border: 1px solid transparent; padding: 0 18px; height: 48px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s, transform .1s; }
.btn:active { transform: translateY(1px); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.primary:hover { background: var(--brand-strong); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--muted); }
.btn.block { width: 100%; }
.btn.small { height: 36px; font-size: 14px; padding: 0 12px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--brand); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Zoekband */
.band { background: var(--brand); color: var(--brand-ink); padding-block: 40px 96px; }
.band.compact { padding-block: 20px 64px; }
.band h1 { font-size: clamp(32px, 5vw, 54px); font-weight: 800; max-width: 16ch; letter-spacing: -0.03em; }
.band h1 em { font-style: normal; color: var(--accent); }
.band .lede { margin-top: 12px; max-width: 54ch; font-size: 18px; opacity: 0.9; }
.tally { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 18px; font: 500 13px/1.4 var(--f-mono); opacity: 0.85; }
.tally b { font-weight: 500; color: var(--accent); }
.search-wrap { margin-top: -72px; position: relative; z-index: 2; }
.band.compact + .wrap .search-wrap, .search-wrap.tight { margin-top: -48px; }

.search { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); border: 1px solid var(--line); }
.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); padding-inline: 8px; overflow-x: auto; }
.tab { background: none; border: 0; font: 600 15px/1 var(--f-body); color: var(--muted); padding: 16px 14px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab .pill { font: 600 11px/1 var(--f-body); letter-spacing: 0.06em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent-ink); padding: 4px 6px; border-radius: 4px; }
.tab svg { width: 18px; height: 18px; flex: none; }

.classic-form { display: grid; grid-template-columns: 1.3fr 1fr 130px auto; gap: 10px; padding: 16px; align-items: end; }
.field { display: grid; gap: 6px; min-width: 0; }
.field > span { font: 600 12px/1 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.field input, .field select, .field textarea, .input {
  font: 400 16px/1.3 var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm); height: 48px; padding: 0 14px; width: 100%; min-width: 0;
}
.field input:focus, .field select:focus, .field textarea:focus, .prompt-box textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.field.withicon { position: relative; }
.field.withicon input { padding-left: 40px; }
.field.withicon svg { position: absolute; left: 13px; bottom: 15px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }

.prompt-form { padding: 16px; display: grid; gap: 12px; }
.prompt-box { position: relative; }
.prompt-box textarea { width: 100%; font: 400 18px/1.45 var(--f-body); color: var(--ink); background: var(--accent-soft); border: 1px solid transparent; border-radius: var(--r-sm); padding: 14px 16px; resize: vertical; min-height: 92px; }
.prompt-box textarea::placeholder { color: var(--muted); }
.prompt-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.prompt-foot .hint { font-size: 14px; color: var(--muted); max-width: 60ch; }
.examples { display: flex; flex-wrap: wrap; gap: 8px; }
.example { font: 500 14px/1.3 var(--f-body); color: var(--ink); background: var(--surface); border: 1px dashed var(--line); border-radius: 99px; padding: 7px 12px; cursor: pointer; text-align: left; }
.example:hover { border-color: var(--brand); color: var(--brand); }

/* Startpagina */
.home-sections { display: grid; gap: 48px; padding-block: 40px 64px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head h2 { font-size: 26px; font-weight: 700; }
.prompt-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.prompt-card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; cursor: pointer; font: inherit; color: var(--ink); display: grid; gap: 12px; align-content: space-between; }
.prompt-card:hover { border-color: var(--brand); }
.prompt-card q { font-size: 17px; line-height: 1.4; quotes: "“" "”"; }
.prompt-card span { font: 500 13px/1.3 var(--f-mono); color: var(--brand); }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.cat-grid a { background: var(--surface); padding: 16px 18px; text-decoration: none; color: var(--ink); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 600; }
.cat-grid a:hover { background: var(--brand-soft); }
.cat-grid .mono { color: var(--muted); font-size: 13px; font-weight: 400; }
.region-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.region { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; text-decoration: none; color: var(--ink); display: grid; gap: 4px; }
.region:hover { border-color: var(--brand); }
.region strong { font: 700 22px/1.1 var(--f-display); }
.region .mono { color: var(--muted); font-size: 13px; }

/* Resultaten */
.results-page { padding-block: 24px 64px; display: grid; gap: 20px; }
.interpret { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; }
.interpret-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.interpret-head h2 { font-size: 18px; font-weight: 700; }
.interpret .quote { font-size: 15px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--brand-soft); color: var(--ink); border-radius: 99px; padding: 5px 6px 5px 12px; font-size: 14px; }
.chip b { font-weight: 600; color: var(--brand-strong); }
.chip button { border: 0; background: transparent; color: var(--muted); width: 24px; height: 24px; border-radius: 99px; cursor: pointer; display: grid; place-items: center; }
.chip button:hover { background: var(--surface); color: var(--ink); }
.chip.off { background: transparent; border: 1px dashed var(--line); color: var(--muted); padding-right: 12px; }
.notice { background: var(--accent-soft); color: var(--ink); border-radius: var(--r-sm); padding: 12px 14px; font-size: 15px; }

.res-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px; align-items: start; }
.filters { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 92px); overflow: auto; }
.filters summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
.filters summary::-webkit-details-marker { display: none; }
.filters summary .chev { transition: transform .2s; }
.filters[open] summary .chev { transform: rotate(180deg); }
.filter-body { padding: 0 16px 16px; display: grid; gap: 18px; }
.fgroup { display: grid; gap: 6px; border: 0; margin: 0; padding: 0; min-width: 0; }
.fgroup legend, .fgroup > .flabel { font: 600 12px/1 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; padding: 0; }
.check { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; padding: 2px 0; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); margin: 0; flex: none; }
.check .n { margin-left: auto; font: 400 12px/1 var(--f-mono); color: var(--muted); }
.check.zero { opacity: 0.45; }
.filters select { height: 40px; }

.res-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.res-head h1 { font-size: clamp(22px, 3vw, 28px); font-weight: 700; }
.res-head h1 .mono { font-family: var(--f-display); color: var(--brand); }
.sort { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.sort select { height: 38px; width: auto; padding: 0 10px; }
.job-list { display: grid; gap: 12px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 32px; text-align: center; display: grid; gap: 12px; justify-items: center; }
.empty h2 { font-size: 22px; }

/* Jobkaart */
.job-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 18px 16px; display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 4px 16px; transition: border-color .15s, box-shadow .15s; }
.job-card:hover { border-color: var(--brand); box-shadow: var(--shadow); }
.job-card.visited h3 a { color: var(--muted); }
.logo { --h: 160; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font: 800 18px/1 var(--f-display); letter-spacing: -0.02em; background: hsl(var(--h) 38% var(--logo-bg-l)); color: hsl(var(--h) 55% var(--logo-fg-l)); flex: none; }
.logo.big { width: 72px; height: 72px; border-radius: 16px; font-size: 26px; }
.job-main { min-width: 0; display: grid; gap: 6px; }
.job-card h3 { font-size: 19px; font-weight: 700; }
.job-card h3 a { color: var(--ink); text-decoration: none; }
.job-card h3 a::after { content: ""; position: absolute; inset: 0; border-radius: var(--r); }
.job-card h3 a:focus-visible { outline: none; }
.job-card:has(h3 a:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
.job-sub { color: var(--muted); font-size: 15px; }
.job-sub strong { color: var(--ink); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; line-height: 1; padding: 6px 9px; border-radius: 5px; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.tag.salary { font-family: var(--f-mono); font-variant-numeric: tabular-nums; background: transparent; border: 1px solid var(--line); }
.tag.knelpunt { background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }
.tag.remote { background: var(--brand-soft); color: var(--brand-strong); }
.tag svg { width: 14px; height: 14px; }
.job-side { display: grid; justify-items: end; align-content: space-between; gap: 8px; position: relative; z-index: 1; }
.posted { font-size: 13px; color: var(--muted); white-space: nowrap; }
.save { width: 40px; height: 40px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.save:hover { color: var(--brand); border-color: var(--brand); }
.save[aria-pressed="true"] { color: var(--brand-ink); background: var(--brand); border-color: var(--brand); }
.save svg { width: 18px; height: 18px; }

.match { grid-column: 2 / -1; margin-top: 10px; padding-top: 12px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; align-items: center; }
.score { font: 700 15px/1 var(--f-mono); color: var(--accent-ink); background: var(--accent-soft); padding: 6px 8px; border-radius: 5px; font-variant-numeric: tabular-nums; }
.score.mid { color: var(--ink); background: var(--surface-2); }
.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; }
.reasons li { display: inline-flex; gap: 6px; align-items: baseline; }
.reasons .ok::before { content: "✓"; color: var(--good); font-weight: 700; }
.reasons .no { color: var(--muted); }
.reasons .no::before { content: "✕"; color: var(--bad); font-weight: 700; }

/* Detail */
.detail-page { padding-block: 24px 64px; display: grid; gap: 28px; }
.crumbs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.crumbs a { font-weight: 600; }
.detail-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: start; }
.detail-head h1 { font-size: clamp(28px, 4vw, 42px); font-weight: 800; letter-spacing: -0.025em; }
.detail-head .company { font-size: 18px; margin-top: 6px; color: var(--muted); }
.detail-head .company strong { color: var(--ink); }
.facts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 14px; font-size: 15px; }
.facts span { display: inline-flex; gap: 7px; align-items: center; }
.facts svg { width: 17px; height: 17px; color: var(--brand); flex: none; }
.detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; }
.detail-body { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: clamp(20px, 3vw, 36px); display: grid; gap: 28px; }
.detail-body section { display: grid; gap: 10px; max-width: 68ch; }
.detail-body h2 { font-size: 22px; font-weight: 700; }
.detail-body ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.detail-body li::marker { color: var(--brand); }
.benefits { list-style: none; padding: 0 !important; display: grid !important; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px !important; }
.benefits li { background: var(--surface-2); border-radius: var(--r-sm); padding: 9px 12px; font-size: 15px; }
.why-box { background: var(--accent-soft); border-radius: var(--r-sm); padding: 16px 18px; display: grid; gap: 10px; max-width: none !important; }
.why-box h2 { font-size: 18px; }
.why-box .reasons { flex-direction: column; gap: 6px; font-size: 15px; }
.apply-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); }
.apply-card .big-sal { font: 700 26px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.apply-card .big-sal small { display: block; font: 400 14px/1.4 var(--f-body); color: var(--muted); letter-spacing: 0; margin-top: 4px; }
.applied { background: var(--brand-soft); color: var(--brand-strong); border-radius: var(--r-sm); padding: 10px 12px; font-weight: 600; font-size: 15px; }
.dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; margin: 0; font-size: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.dl dt { color: var(--muted); }
.dl dd { margin: 0; text-align: right; font-weight: 500; }
.similar h2 { font-size: 24px; margin-bottom: 14px; }

/* Dialoog */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -20px rgb(0 0 0 / 0.5); }
dialog::backdrop { background: rgb(10 25 22 / 0.55); }
.dialog-body { padding: 24px; display: grid; gap: 16px; }
.dialog-body h2 { font-size: 24px; }
.dialog-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; }
.x { background: var(--surface-2); border: 0; width: 36px; height: 36px; border-radius: 99px; cursor: pointer; color: var(--ink); font-size: 18px; flex: none; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
.field textarea { height: auto; min-height: 110px; padding: 12px 14px; resize: vertical; }
.field input[type="file"] { padding: 10px; height: auto; }
.consent { display: flex; gap: 10px; font-size: 14px; color: var(--muted); align-items: start; }
.consent input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--brand); flex: none; }

/* Deterministische generator: elke rol wordt bij 2-4 passende bedrijven geplaatst. */
JW.buildJobs = function () {
  let seed = 20261007;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const cityBy = Object.fromEntries(JW.CITIES.map((c) => [c.name, c]));
  const catLabel = Object.fromEntries(JW.CATEGORIES.map((c) => [c.id, c.label]));
  const sectorWord = { ict: "de IT-sector", finance: "de financiële sector", zorg: "zorg", onderwijs: "onderwijs", logistiek: "logistiek", productie: "de productie", bouw: "de bouw", techniek: "de technische dienst", horeca: "de horeca", sales: "retail", admin: "dienstverlening" };
  const jobs = [];
  let n = 400;

  JW.ROLES.forEach((role) => {
    const companies = JW.COMPANIES.filter((c) => role.sectors.includes(c.sector));
    const shuffled = companies.slice().sort(() => rnd() - 0.5);
    const count = Math.min(shuffled.length, 2 + Math.floor(rnd() * 3));
    shuffled.slice(0, count).forEach((co) => {
      const city = cityBy[co.city];
      const wallonia = city.region === "Wallonië";
      const brussels = city.region === "Brussel";
      const east = co.city === "Eupen";
      let langs = ["NL"];
      if (wallonia) langs = ["FR"];
      if (east) langs = ["DE", "FR"];
      if (brussels) langs = ["NL", "FR"];
      if (/Frans/.test(role.profile.join(" ")) && !langs.includes("FR") && rnd() > 0.4) langs.push("FR");
      if (/Engels/.test(role.profile.join(" ")) && rnd() > 0.5) langs.push("EN");
      const step = 50;
      const min = Math.round((role.sal[0] + (rnd() - 0.5) * 200) / step) * step;
      const max = Math.round((role.sal[1] + (rnd() - 0.5) * 200) / step) * step;
      const regime = rnd() > 0.5 ? role.regime[0] : pick(role.regime);
      const contract = pick(role.contract);
      const ben = role.ben.filter(() => rnd() > 0.2);
      const daysAgo = Math.floor(rnd() * 29);
      const views = 40 + Math.floor(rnd() * 900);
      n += 1 + Math.floor(rnd() * 37);
      jobs.push({
        id: "jw" + n,
        ref: "JW-2026-" + String(n).padStart(4, "0"),
        role: role.key,
        title: role.title,
        cat: role.cat,
        catLabel: catLabel[role.cat],
        company: co,
        city: city.name,
        pc: city.pc,
        prov: city.prov,
        region: city.region,
        lat: city.lat,
        lng: city.lng,
        salMin: Math.min(min, max - 200),
        salMax: max,
        paritair: role.pc,
        edu: role.edu,
        exp: role.exp,
        regime,
        hours: regime === "voltijds" ? (role.pc === "PC 330" ? "38 u/week" : "38 u/week") : pick(["19 u/week (halftijds)", "30,4 u/week (4/5)", "24 u/week"]),
        contract,
        remote: role.remote,
        shifts: role.shifts,
        weekend: role.weekend,
        knelpunt: role.knelpunt,
        tags: role.tags,
        kw: role.kw,
        langs: Array.from(new Set(langs)),
        benefits: ben,
        daysAgo,
        views,
        intro: role.intro.replace("{sector}", sectorWord[co.sector] || "het team"),
        tasks: role.tasks,
        profile: role.profile,
        start: pick(["Zo snel mogelijk", "In overleg", "1 november 2026", "1 december 2026", "Januari 2027"])
      });
    });
  });
  return jobs;
};

JW.JOBS = JW.buildJobs();
